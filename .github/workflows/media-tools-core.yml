# 変換エンジン（FFmpeg + mt_core）の iOS 用フレームワークをビルドして Release に置く。
# アプリの EAS Build はここで作った zip をダウンロードして組み込む（modules/media-tools/ios/MediaTools.podspec）。
name: media-tools-core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - modules/media-tools/core/**
      - .github/workflows/media-tools-core.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$XCODE" ] && sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Install build tools
        run: brew install meson ninja nasm pkg-config
      - name: Cache third-party builds
        uses: actions/cache@v5
        with:
          path: modules/media-tools/core/.build
          key: core-${{ hashFiles('modules/media-tools/core/build-ios.sh') }}
      - name: Build xcframework
        run: |
          set -o pipefail
          modules/media-tools/core/build-ios.sh 2>&1 | tee build.log
      - name: Show failure log
        if: failure()
        run: |
          # configure の詳細ログがあれば末尾を足す
          for f in modules/media-tools/core/.build/ffmpeg-*/ffbuild/config.log; do [ -f "$f" ] && tail -n 60 "$f" >> build.log; done
          .github/scripts/annotate-log.sh build.log 240
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat modules/media-tools/core/VERSION)
          TAG="media-tools-core-v$VERSION"
          ZIP=modules/media-tools/core/dist/MediaToolsCore.xcframework.zip
          shasum -a 256 "$ZIP"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes "変換エンジン（FFmpeg LGPL + dav1d + LAME + mt_core）の iOS 用フレームワーク"
          fi
